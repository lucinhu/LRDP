name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LRDP_FFMPEG_ROOT: ${{ github.workspace }}/build/deps/ffmpeg/linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev liblzma-dev libssl-dev libsecret-1-dev libpulse-dev nasm
      - run: bash scripts/build_ffmpeg.sh linux-x64
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Native lifecycle regression
        run: |
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLRDP_BUILD_TESTS=ON
          cmake --build build/native -j 4
          ctest --test-dir build/native --output-on-failure
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: flutter build linux --release --target lib/main.dart
