name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LRDP_FFMPEG_ROOT: ${{ github.workspace }}/build/deps/ffmpeg/linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: SDK versions
        run: |
          flutter --version
          dart --version
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev liblzma-dev libssl-dev libsecret-1-dev libpulse-dev libva-dev libdrm-dev libavcodec-dev libavutil-dev libswscale-dev nasm
      - name: Fetch pinned FFmpeg archive
        run: |
          mkdir -p build/deps/downloads
          archive=build/deps/downloads/ffmpeg-9.0.2.tar.xz
          if ! curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 1 \
            https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz -o "$archive"; then
            curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --retry 2 \
              https://github.com/lucinhu/LRDP/releases/download/v0.4.0-preview.1/lrdp-0.4.0-source.tar.gz \
              -o "$RUNNER_TEMP/lrdp-previous-source.tar.gz"
            tar -xOzf "$RUNNER_TEMP/lrdp-previous-source.tar.gz" \
              lrdp-0.4.0-source/vendor/ffmpeg-9.0.2.tar.xz > "$archive"
          fi
          echo '8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  build/deps/downloads/ffmpeg-9.0.2.tar.xz' | sha256sum --check
      - run: bash scripts/build_ffmpeg.sh linux-x64
      - run: flutter pub get
      - run: python3 scripts/generate_version.py --check
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Native lifecycle regression
        run: |
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLRDP_BUILD_TESTS=ON
          cmake --build build/native -j 4
          ctest --test-dir build/native --output-on-failure
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: flutter build linux --release --target lib/main.dart
