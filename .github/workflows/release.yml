name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (must already exist on origin)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  FLUTTER_VERSION: '3.47.7'

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      LRDP_FFMPEG_ROOT: ${{ github.workspace }}/build/deps/ffmpeg/linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates clang cmake curl desktop-file-utils dpkg-dev file git \
            gobject-introspection libgirepository1.0-dev libgtk-3-dev libepoxy-dev \
            liblzma-dev libssl-dev libsecret-1-dev libpulse-dev librsvg2-dev \
            libfuse2 libegl1-mesa libgl1-mesa-dri libglu1-mesa ibus-gtk3 \
            fcitx5-frontend-gtk3 fonts-noto-cjk make nasm ninja-build patchelf \
            pkg-config python3 unzip xz-utils zstd
      - name: Build static FFmpeg (linux-x64)
        run: |
          mkdir -p build/release-logs
          LRDP_BUILD_JOBS=4 bash scripts/build_ffmpeg.sh linux-x64 2>&1 | tee build/release-logs/ffmpeg-linux.log
      - name: Version, format and static analysis
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build/release-logs/pub-get.log
          python3 scripts/generate_version.py --check
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver
          flutter analyze 2>&1 | tee build/release-logs/analyze.log
      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee build/release-logs/flutter-test.log
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee build/release-logs/python-tests.log
      - name: Native CTest
        run: |
          set -o pipefail
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DLRDP_BUILD_TESTS=ON -DLRDP_FFMPEG_ROOT="$LRDP_FFMPEG_ROOT" 2>&1 | tee build/release-logs/native-configure.log
          cmake --build build/native -j 4 2>&1 | tee build/release-logs/native-build.log
          ctest --test-dir build/native --output-on-failure 2>&1 | tee build/release-logs/ctest.log
      - name: Linux release bundle
        run: |
          set -o pipefail
          LRDP_BUILD_JOBS=4 flutter build linux --release --target lib/main.dart 2>&1 | tee build/release-logs/linux-release-build.log
      - name: AppImage
        run: |
          set -o pipefail
          LRDP_DISTRIBUTIONS_DIR="$PWD/build/release-dist" LRDP_BUILD_JOBS=4 \
            bash scripts/package_appimage.sh 2>&1 | tee build/release-logs/appimage.log
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            build/release-dist/*.AppImage
            build/release-logs/*.log

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      LRDP_OPENSSL_ROOT: ${{ github.workspace }}/build/deps/android-openssl
      LRDP_FFMPEG_ROOT: ${{ github.workspace }}/build/deps/ffmpeg/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm unzip file
          mkdir -p build/release-logs
      - name: Android NDK
        run: |
          set -o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "ndk;28.2.13676358" 2>&1 | tail -5
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Android OpenSSL and FFmpeg
        run: |
          set -o pipefail
          mkdir -p build/deps/sources build/deps/downloads
          curl --fail --location --retry 3 \
            https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz \
            -o build/deps/downloads/openssl-3.6.5.tar.gz
          echo 'a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98  build/deps/downloads/openssl-3.6.5.tar.gz' \
            | sha256sum --check
          tar -xzf build/deps/downloads/openssl-3.6.5.tar.gz -C build/deps/sources
          export LRDP_OPENSSL_SOURCE="$PWD/build/deps/sources/openssl-3.6.5"
          bash scripts/build_android_openssl.sh arm64-v8a 2>&1 | tee build/release-logs/android-openssl.log
          LRDP_BUILD_JOBS=4 bash scripts/build_ffmpeg.sh android-arm64 2>&1 | tee build/release-logs/ffmpeg-android.log
      - name: Signed ARM64 release APK
        env:
          LRDP_ANDROID_KEYSTORE_B64: ${{ secrets.LRDP_ANDROID_KEYSTORE }}
          LRDP_ANDROID_KEY_ALIAS: ${{ secrets.LRDP_ANDROID_KEY_ALIAS }}
          LRDP_ANDROID_STORE_PASSWORD: ${{ secrets.LRDP_ANDROID_STORE_PASSWORD }}
          LRDP_ANDROID_KEY_PASSWORD: ${{ secrets.LRDP_ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          keystore="$RUNNER_TEMP/lrdp-release.jks"
          printf '%s' "$LRDP_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          export LRDP_ANDROID_KEYSTORE="$keystore"
          flutter pub get 2>&1 | tee build/release-logs/android-pub-get.log
          flutter build apk --release --target lib/main.dart --target-platform android-arm64 \
            2>&1 | tee build/release-logs/android-build.log
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/lrdp-release.apk"
          rm -f "$keystore"
      - name: Validate APK
        run: |
          set -o pipefail
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p build/release-dist
          cp "$RUNNER_TEMP/lrdp-release.apk" "build/release-dist/lrdp-$version-android-arm64-release.apk"
          apk="build/release-dist/lrdp-$version-android-arm64-release.apk"
          python3 scripts/check_android_apk.py "$apk" \
            --abi arm64-v8a --build-mode release 2>&1 | tee build/release-logs/android-check.log
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$apk" | head -2 | tee build/release-logs/android-badging.log
          python3 - "$apk" "$build_tools" "$RELEASE_TAG" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          apk, build_tools, tag = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          badging = subprocess.check_output([str(build_tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          meta = {'release_tag_in_aot': tag}
          match = re.search(r"versionCode='(\d+)' versionName='([^']+)'", badging)
          if match:
              meta['version_code'] = int(match.group(1))
              meta['version_name'] = match.group(2)
          certs = subprocess.run([str(build_tools / 'apksigner'), 'verify', '--print-certs', str(apk)],
                                  check=True, capture_output=True, text=True).stdout
          match = re.search(r'certificate SHA-256 digest:\s*([0-9a-f:]+)', certs)
          if match:
              meta['certificate_sha256'] = match.group(1).replace(':', '')
          (apk.parent / 'apk-meta.json').write_text(json.dumps(meta, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: |
            build/release-dist/*.apk
            build/release-dist/apk-meta.json
            build/release-logs/*.log

  source:
    name: Source and FFmpeg rebuild kit
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 xz-utils curl
          mkdir -p build/release-logs
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" 2>&1 | tail -3
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Static FFmpeg for every documented platform
        run: |
          set -o pipefail
          LRDP_BUILD_JOBS=4 bash scripts/build_ffmpeg.sh \
            linux-x64 windows-x64 android-arm64 android-x64 \
            2>&1 | tee build/release-logs/ffmpeg-rebuild-kit.log
      - name: Source archive
        run: |
          set -o pipefail
          LRDP_DISTRIBUTIONS_DIR="$PWD/build/release-dist" python3 scripts/package_source.py \
            2>&1 | tee build/release-logs/source.log
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          if-no-files-found: error
          path: |
            build/release-dist/*-source.tar.gz
            build/release-logs/*.log

  publish:
    name: Publish GitHub release
    needs: [linux, android, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - name: Collect artifacts
        run: |
          mkdir -p build/release-dist build/release-logs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-collected
      - name: Assemble metadata
        run: |
          set -o pipefail
          find build/release-collected -type f -name '*.log' -exec cp {} build/release-logs/ \;
          find build/release-collected -type f \
            \( -name '*.AppImage' -o -name '*.apk' -o -name '*.tar.gz' -o -name 'apk-meta.json' \) \
            -exec cp {} build/release-dist/ \;
          sudo apt-get update && sudo apt-get install -y binutils unzip
          python3 scripts/assemble_release.py \
            --dist build/release-dist \
            --logs build/release-logs \
            --tag "$RELEASE_TAG" \
            --version "$(sed -n 's/^version: //p' pubspec.yaml)" \
            --commit "$(git rev-parse "${RELEASE_TAG}^{commit}")" \
            --runner "ubuntu-22.04 (GitHub Actions)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            2>&1 | tee build/release-logs/assemble.log
      - name: Release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          LRDP **0.4.0** 开发预览（`v0.4.0-preview.1`，Android versionCode 7）。

          本次二进制由 GitHub Actions 在 ubuntu-22.04 上从本标签对应提交构建：Linux x86_64 AppImage（glibc ≤ 2.35 校验通过）、Android ARM64 正式签名 APK、源码与 FFmpeg 重建资料。原生 ABI 保持 v5（28 个导出），FreeRDP 子模块未修改。

          ## 功能

          - 屏幕键盘长按连续触发：方向键、Home/End、PgUp/PgDn、Insert/Delete、退格与回车支持按住重复（60 ms 间隔），轻点仍只发送一次；横向滑动按键栏由滚动识别器胜出，不会误发按键，松开、指针取消、会话断开或控件销毁时立即停止。
          - 桌面端键盘从模态对话框改为会话内分组悬浮面板：左侧为文字输入/粘贴输入与发送，右侧为修饰键、方向键倒 T 与编辑键分组，可展开功能键、组合键与数字/符号；面板浮在远程画面上，不改变远程视口与分辨率，Esc 或“收起键盘”关闭，`Ctrl + Alt + Home` 释放控制时自动收起。
          - 浅色主题中性白：Material 3 中性色阶不再被种子色或系统强调色染成绿灰，`surface` 保持纯白，`surfaceContainer*`、画布、描边与文字改为中性灰阶；弹窗、悬浮工具栏与键盘面板使用白色表面，深色主题同步去除偏色。系统配色仍只决定强调色。
          - 构建诊断清理：只在构建 vendored FreeRDP 子目录时静音上游弃用警告、生成 getter 的 `-Wswitch` 与 GCC `-Wunused-result` 噪音，配置后即恢复；LRDP 自有源码仍保持 `-Wall -Wextra -Werror`，子模块未修改，Linux 与 Android 构建输出 0 warning。

          ## 验证范围

          CI 已执行 Flutter analyze、完整 `flutter test`（282）、原生 CTest（5/5）、Python 检查、Android APK 静态校验（ABI/RELRO/ZIP 对齐/签名/主入口）与 AppImage payload/glibc 校验；日志与构建信息见 `lrdp-0.4.0-verification.zip`、`BUILD_INFO.json`。

          **尚未验收**：本轮 AppImage 的交互式 OS 验收（FUSE/解压启动、窗口、全屏、输入释放、NLA 回环）未在发布流程内重跑；键盘长按与桌面键盘面板的真实桌面/真机手感、厂商输入法与高 DPI 表现待验收；Android ARM64 真机未验收；本次不提供 Windows/macOS/iOS 安装包；其他发行版与原生 Wayland 待验收。历史 0.2.0 与 0.3.0 批次的验收记录仍然有效。

          ## 安装

          ```sh
          chmod +x lrdp-0.4.0-linux-x64.AppImage
          ./lrdp-0.4.0-linux-x64.AppImage
          ```

          需要 glibc ≥ 2.35 与可用的 OpenGL/EGL；无 FUSE 时可用 `APPIMAGE_EXTRACT_AND_RUN=1` 启动。Android 安装 ARM64 APK；APK 使用 LRDP 正式发布密钥签名，可覆盖安装 0.3.0 正式签名包；本地调试签名或更早的预览包需要先卸载（会清除应用数据）。

          校验：`sha256sum -c SHA256SUMS`。
          NOTES
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f build/release-dist/apk-meta.json
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release-dist/* --clobber
          else
            prerelease=()
            if [ "${{ inputs.prerelease }}" = "true" ]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" build/release-dist/* \
              --title "LRDP $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag "${prerelease[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            build/release-dist/BUILD_INFO.json
            build/release-dist/RELEASE_INFO.json
            build/release-dist/SHA256SUMS
            build/release-dist/SOURCE_SHA256
            build/release-dist/*-verification.zip
